AutoName: BathyApp
Summary: Bathymetry profiles and grids from GEBCO and EMODnet data
Description: |-
    Generate bathymetric profiles and depth grids for any spot in the ocean,
    directly on your phone.

    Data sources:

    * GEBCO 2026 (worldwide, 15 arc-second), with a local crop cache
    * EMODnet Bathymetry WCS (European waters, 3.75 arc-second)
    * local NetCDF (CDF-1/CDF-2) or float GeoTIFF files, fully offline

    Features a rotating 3D globe with NASA Blue Marble satellite imagery and
    bathymetry ocean shading for area selection, an interactive depth raster map, great-circle depth profiles
    with statistics, and GeoTIFF/CSV export. NetCDF, GeoTIFF, WCS and GEBCO
    crop clients are hand-written Kotlin, no binary blobs, no tracking.

    Data: GEBCO (https://www.gebco.net) and EMODnet
    (https://emodnet-bathymetry.eu/en/bathymetry), used under their open
    licenses.
