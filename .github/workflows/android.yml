name: android-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Set up release keystore
        env:
          BATHY_KEYSTORE_B64: ${{ secrets.BATHY_KEYSTORE_B64 }}
          BATHY_KEYSTORE_PASSWORD: ${{ secrets.BATHY_KEYSTORE_PASSWORD }}
          BATHY_KEY_ALIAS: ${{ secrets.BATHY_KEY_ALIAS }}
          BATHY_KEY_PASSWORD: ${{ secrets.BATHY_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$BATHY_KEYSTORE_B64" ]; then
            echo "Decoding provided release keystore"
            echo "$BATHY_KEYSTORE_B64" | base64 -d > "$HOME/bathyapp-release.keystore"
            echo "BATHY_KEYSTORE_PATH=$HOME/bathyapp-release.keystore" >> "$GITHUB_ENV"
            echo "BATHY_KEYSTORE_PASSWORD=$BATHY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BATHY_KEY_ALIAS=$BATHY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BATHY_KEY_PASSWORD=$BATHY_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured - generating an ephemeral one."
            keytool -genkeypair -v \
              -keystore "$HOME/bathyapp-release.keystore" \
              -storepass android -keypass android \
              -alias bathyapp -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BathyApp, O=BathyApp" >/dev/null 2>&1
            echo "BATHY_KEYSTORE_PATH=$HOME/bathyapp-release.keystore" >> "$GITHUB_ENV"
            echo "BATHY_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "BATHY_KEY_ALIAS=bathyapp" >> "$GITHUB_ENV"
            echo "BATHY_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          gradle :core:test :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_output.txt

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bathyapp-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Report failure as issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          grep -E '^e: ' gradle_output.txt > /tmp/fail.txt || true
          sed -n '/FAILURE: Build failed/,$p' gradle_output.txt >> /tmp/fail.txt || true
          find . -path '*/build/test-results/*/TEST-*.xml' -type f 2>/dev/null | while read -r f; do
            if grep -q '<failure\|<error' "$f"; then
              awk '
                /<testcase / {
                  match($0, /classname="[^"]*"/); cn=substr($0,RSTART+11,RLENGTH-12)
                  match($0, /name="[^"]*"/); tc=substr($0,RSTART+6,RLENGTH-7)
                }
                /<failure|<error/ {
                  match($0, /message="[^"]*"/); msg=substr($0,RSTART+9,RLENGTH-10)
                  print "FAILED TEST " cn "." tc ": " msg
                }
              ' "$f" | sed 's/&#10;/\n/g; s/&#9;/\t/g; s/&quot;/\"/g; s/&lt;/</g; s/&gt;/>/g; s/&amp;/\&/g' >> /tmp/fail.txt
              echo "" >> /tmp/fail.txt
            fi
          done
          [ -s /tmp/fail.txt ] || tail -c 60000 gradle_output.txt > /tmp/fail.txt
          {
            echo "CI build failed."
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            echo '````'
            cat /tmp/fail.txt
            echo '````'
          } > /tmp/issue_body.md
          jq -n --rawfile body /tmp/issue_body.md \
             --arg title "CI failure @ ${{ github.sha }}" \
             '{title: $title, body: $body}' > /tmp/issue.json
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/issue.json >/dev/null
          echo "Issue created."
